[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haml"
version = "1.0"
description = "Hyper-YAML!"
authors = [
  {name = "Sascha Mücke", email = "sascha.muecke@tu-dortmund.de"},
  {name = "Sebastian Buschjäger", email = "sebastian.buschjaeger@tu-dortmund.de"}
]
requires-python = ">= 3.8"
dependencies = [
  "numpy>=1.17"
]
readme = "README.md"

[project.urls]
Repository = "https://github.com/lamarr-institute/haml.git"
